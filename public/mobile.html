<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>📱 Prototype · Mobile</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f5f5f5;
        font-family: system-ui, sans-serif;
      }
      .phone {
        position: relative;
        width: 375px;
        height: 812px;
        border-radius: 3rem;
        border: 8px solid #171717;
        background: #fff;
        overflow: hidden;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      }
      iframe {
        width: 100%;
        height: 100%;
        border: none;
      }
      .phone-wrapper {
        position: relative;
      }
    </style>
  </head>
  <body>
    <div class="phone-wrapper">
      <div class="phone">
        <iframe id="preview" src="/" title="App preview"></iframe>
      </div>
    </div>
    <script>
      const iframe = document.getElementById("preview");

      // On load, read the iframe path from the URL search params
      const params = new URLSearchParams(window.location.search);
      const initialPath = params.get("path");
      if (initialPath) {
        iframe.src = initialPath;
      }

      function syncUrl() {
        try {
          const iframePath =
            iframe.contentWindow.location.pathname +
            iframe.contentWindow.location.search +
            iframe.contentWindow.location.hash;
          const url = new URL(window.location);
          if (iframePath && iframePath !== "/") {
            url.searchParams.set("path", iframePath);
          } else {
            url.searchParams.delete("path");
          }
          window.history.replaceState(null, "", url);
        } catch (e) {
          // cross-origin — ignore silently
        }
      }

      // Sync on full page loads and intercept SPA navigations
      iframe.addEventListener("load", () => {
        syncUrl();

        try {
          const iframeHistory = iframe.contentWindow.history;

          // Patch pushState/replaceState to detect SPA navigations
          for (const method of ["pushState", "replaceState"]) {
            const original = iframeHistory[method];
            iframeHistory[method] = function (...args) {
              original.apply(this, args);
              syncUrl();
            };
          }

          // Also catch back/forward navigation
          iframe.contentWindow.addEventListener("popstate", syncUrl);
        } catch (e) {
          // cross-origin — ignore silently
        }
      });
    </script>
  </body>
</html>
